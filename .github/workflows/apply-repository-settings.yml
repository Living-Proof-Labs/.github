# SPDX-License-Identifier: Apache-2.0
name: Apply repository settings

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply this run's full-inventory preview after protected approval (review all unresolved results)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: repository-settings
  cancel-in-progress: false

jobs:
  preview:
    name: Preview checked-in policy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: repository-administration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.54.0'
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ vars.REPO_ADMIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ADMIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-pages: read
      - run: task setup
      - name: Preview full inventory without writes
        id: preview_operation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          task github:settings:reconcile -- --dry-run --plan-output artifacts/settings-plan.json --summary-output artifacts/preview.md --report-output artifacts/preview.json --junit artifacts/settings-preview.xml | tee artifacts/preview.txt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Record preview result and require a complete plan
        if: always()
        run: |
          printf 'Preview outcome: %s. Review repository-settings-preview for every repository, planned changes and unresolved state. Review each disclosed ruleset action; stronger protection is preserved.\n' "$PREVIEW_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/preview.md ]; then cat artifacts/preview.md >> "$GITHUB_STEP_SUMMARY"; fi
          test -s artifacts/settings-plan.json
        env:
          PREVIEW_OUTCOME: ${{ steps.preview_operation.outcome }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-settings-preview
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
  apply:
    name: Apply reviewed repository settings
    needs: preview
    if: github.ref == 'refs/heads/main' && inputs.apply
    runs-on: ubuntu-latest
    environment: repository-administration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.54.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repository-settings-preview
          path: artifacts/preview
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ vars.REPO_ADMIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ADMIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-pages: write
      - run: task setup
      - name: Apply checked-in policy
        shell: bash
        run: |
          set -o pipefail
          task github:settings:reconcile -- --apply --expected-plan artifacts/preview/settings-plan.json --summary-output artifacts/apply.md --report-output artifacts/apply.json --junit artifacts/settings-apply.xml | tee artifacts/apply.txt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Strictly verify every registered repository
        if: always()
        run: |
          task github:settings:reconcile -- --dry-run --fail-on-drift --summary-output artifacts/readback.md --report-output artifacts/readback.json --junit artifacts/readback.xml
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Publish complete outcome summary
        if: always()
        run: |
          for report in artifacts/apply.md artifacts/readback.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-settings-apply-results
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
