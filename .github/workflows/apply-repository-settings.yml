# SPDX-License-Identifier: Apache-2.0
name: Apply repository settings

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Registered repository name; all or blank selects the canonical inventory
        required: false
        type: string
      mode:
        description: HTTPS-only changes existing sites; ordinary uses the pinned settings helper
        required: true
        default: https-only
        type: choice
        options:
          - https-only
          - ordinary
      apply:
        description: Apply the reviewed preview after the protected reviewer gate
        required: true
        default: false
        type: boolean
      apply_pages:
        description: Ordinary mode only — create missing Pages sites or correct Actions source
        required: true
        default: false
        type: boolean
      apply_main_ruleset:
        description: Ordinary mode only — include the separately scoped main-ruleset update
        required: true
        default: false
        type: boolean
      include_release_immutability:
        description: Ordinary mode only — also apply release immutability when API state is unknown
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preview:
    name: Preview pinned policy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: repository-audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.54.0'
      - name: Validate selected operation
        run: |
          if [ "$MODE" = https-only ] && { [ "$PAGES" = true ] || [ "$RULESET" = true ] || [ "$IMMUTABILITY" = true ]; }; then
            echo 'HTTPS-only mode cannot include Pages setup, rulesets or release immutability.' >&2
            exit 64
          fi
        env:
          MODE: ${{ inputs.mode }}
          PAGES: ${{ inputs.apply_pages }}
          RULESET: ${{ inputs.apply_main_ruleset }}
          IMMUTABILITY: ${{ inputs.include_release_immutability }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ vars.REPO_ADMIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ADMIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-pages: read
      - run: task setup
      - name: Preview selected settings without writes
        id: preview_operation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          printf 'source_revision=%s\nmode=%s\nrepository=%s\n' "$SOURCE_REVISION" "$MODE" "${TARGET_REPOSITORY:-all registered}" > artifacts/operation.txt
          arguments=()
          if [ -n "$TARGET_REPOSITORY" ] && [ "$TARGET_REPOSITORY" != all ]; then arguments+=(--repo "$TARGET_REPOSITORY"); fi
          if [ "$MODE" = https-only ]; then
            bash scripts/apply-repo-policy --dry-run --https-only --inventory config/github/repositories.json "${arguments[@]}" --plan-output artifacts/https-plan.json --junit artifacts/https-preview.xml | tee artifacts/preview.txt
          else
            bash tools/github/repository-settings.sh --junit artifacts/settings-preview.xml "${arguments[@]}" | tee artifacts/preview.txt
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODE: ${{ inputs.mode }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REVISION: ${{ github.sha }}
      - name: Record preview result and require a usable plan
        if: always()
        run: |
          printf 'Preview outcome: %s\n' "$PREVIEW_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = https-only ]; then
            test -s artifacts/https-plan.json
          else
            test "$PREVIEW_OUTCOME" = success
          fi
        env:
          MODE: ${{ inputs.mode }}
          PREVIEW_OUTCOME: ${{ steps.preview_operation.outcome }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-settings-preview
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
  apply:
    name: Apply reviewed repository settings
    needs: preview
    if: github.ref == 'refs/heads/main' && inputs.apply
    runs-on: ubuntu-latest
    environment: repository-administration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.54.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repository-settings-preview
          path: artifacts/preview
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ vars.REPO_ADMIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_ADMIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-pages: write
      - run: task setup
      - name: Apply pinned policy
        shell: bash
        run: |
          set -o pipefail
          arguments=()
          if [ -n "$TARGET_REPOSITORY" ] && [ "$TARGET_REPOSITORY" != all ]; then arguments+=(--repo "$TARGET_REPOSITORY"); fi
          if [ "$MODE" = https-only ]; then
            bash scripts/apply-repo-policy --apply --https-only --inventory config/github/repositories.json "${arguments[@]}" --expected-plan artifacts/preview/https-plan.json --junit artifacts/https-apply.xml | tee artifacts/apply.txt
          else
            arguments+=(--apply)
            if [ "$PAGES" = true ]; then arguments+=(--apply-pages); fi
            if [ "$RULESET" = true ]; then arguments+=(--apply-main-ruleset); fi
            if [ "$IMMUTABILITY" = true ]; then arguments+=(--apply-immutable-releases-when-unknown); fi
            bash tools/github/repository-settings.sh "${arguments[@]}" | tee artifacts/apply.txt
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MODE: ${{ inputs.mode }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          PAGES: ${{ inputs.apply_pages }}
          RULESET: ${{ inputs.apply_main_ruleset }}
          IMMUTABILITY: ${{ inputs.include_release_immutability }}
      - name: Strictly verify every registered repository
        if: always()
        run: task github:settings:test
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-settings-apply-results
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
