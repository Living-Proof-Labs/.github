version: '3'

tasks:
  setup:
    desc: Verify the supported Node runtime is available
    cmds:
      - node --version
  check:
    desc: Validate the canonical repository inventory
    cmds:
      - npm run check
  test:
    desc: Test inventory validation
    cmds:
      - npm test
  verify:
    desc: Run inventory checks and tests
    cmds:
      - task: check
      - task: test
  github:settings:check:
    desc: Fail on policy drift or unknown state in every registered repository
    cmds:
      - bash tools/github/repository-settings.sh --fail-on-drift
  github:settings:report:
    desc: Read-only policy audit that reports drift without changing settings
    cmds:
      - bash tools/github/repository-settings.sh
