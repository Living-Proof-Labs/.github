version: '3'

tasks:
  default:
    desc: List available organization operations
    cmds:
      - bash tools/task.sh --list
  setup:
    desc: Install the pinned user-local Node runtime for supported Debian Linux hosts
    cmds:
      - bash tools/setup.sh
  check:
    desc: Validate the canonical repository inventory and organization documentation
    cmds:
      - bash tools/with-node.sh npm run check
  docs:check:
    desc: Check organization docs (pages, links, fragments, directory, Mermaid) before publication
    cmds:
      - bash tools/with-node.sh node tools/docs/check-docs.mjs
  test:
    desc: Test inventory and documentation validation
    cmds:
      - bash tools/with-node.sh npm test
  verify:
    desc: Run inventory and documentation checks and tests
    cmds:
      - task: check
      - task: test
  github:settings:check:
    desc: Fail on policy drift or unknown state in every registered repository
    cmds:
      - bash tools/github/repository-settings.sh --fail-on-drift
  github:settings:report:
    desc: Read-only policy audit that reports drift without changing settings
    cmds:
      - bash tools/github/repository-settings.sh
  github:settings:junit:
    desc: Write JUnit evidence without making existing drift a pull-request blocker
    cmds:
      - bash tools/github/repository-settings.sh --junit artifacts/repository-settings.xml
  github:settings:test:
    desc: Write JUnit evidence and fail on every drift or unverified setting
    cmds:
      - bash tools/github/repository-settings.sh --fail-on-drift --junit artifacts/repository-settings.xml
  github:policy:apply:
    desc: Preview or apply the pinned repository policy. Pass -- --dry-run or -- --apply
    cmds:
      - bash scripts/apply-repo-policy {{.CLI_ARGS}}
  github:apps:check:
    desc: Validate the versioned GitHub App manifests without contacting GitHub
    cmds:
      - bash tools/with-node.sh node tools/github/verify-app-manifests.mjs
  github:apps:form:help:
    desc: Show the local GitHub App registration-form command
    cmds:
      - bash tools/with-node.sh node tools/github/render-app-manifest-form.mjs --help
  github:apps:callback:help:
    desc: Show the loopback-only GitHub App manifest callback command
    cmds:
      - bash tools/with-node.sh node tools/github/receive-app-manifest-code.mjs --help
  github:apps:exchange:help:
    desc: Show the opt-in GitHub App manifest conversion command
    cmds:
      - bash tools/with-node.sh node tools/github/exchange-app-manifest-code.mjs --help
  github:app-token:help:
    desc: Show how to mint a bot GitHub App installation token
    cmds:
      - bash tools/with-node.sh node tools/github/app-token.mjs --help
